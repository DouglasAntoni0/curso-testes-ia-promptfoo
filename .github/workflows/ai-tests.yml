name: AI Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PROMPTFOO_DISABLE_TELEMETRY: '1'

jobs:
  deterministic:
    name: Regressão e contrato (modo simulado)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Instalar dependências
        run: |
          npm ci --prefix tests
          mkdir -p tests/results

      - name: Iniciar ShopDemo v2
        id: app
        env:
          MODE: simulated
          VERSION: v2
        run: |
          node app/server.js > app.log 2>&1 &
          if ! curl -fsS --retry 20 --retry-connrefused --retry-delay 1 --max-time 3 http://localhost:3000/health; then
            cat app.log
            exit 1
          fi

      - name: Testar atendimento
        if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        working-directory: tests
        run: |
          npm run test:deterministic -- --no-progress-bar --no-cache \
            -o results/deterministic.json -o results/deterministic.junit.xml -o results/deterministic.html
      - name: Resumo de deterministic
        if: ${{ !cancelled() }}
        working-directory: tests
        run: |
          if [ -f results/deterministic.json ]; then
            node ci/summary.js results/deterministic.json "Testar atendimento"
          fi

      - name: Testar contrato do classificador
        if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        working-directory: tests
        run: |
          npm run test:classifier -- --no-progress-bar --no-cache \
            -o results/classifier.json -o results/classifier.junit.xml -o results/classifier.html
      - name: Resumo de classifier
        if: ${{ !cancelled() }}
        working-directory: tests
        run: |
          if [ -f results/classifier.json ]; then
            node ci/summary.js results/classifier.json "Testar contrato do classificador"
          fi

      - name: Guardar relatórios
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: suite-deterministic
          path: tests/results/
          retention-days: 14

  with-ai:
    name: Avaliações com IA (Ollama)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: deterministic
    env:
      APP_MODEL: qwen3.5:9b
      JUDGE_MODEL: qwen3.5:9b
      COMPARE_MODEL: qwen3.5:4b
      OLLAMA_BASE_URL: http://localhost:11434
      OLLAMA_CONTEXT_LENGTH: '4096'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_NUM_PARALLEL: '1'
      REQUEST_TIMEOUT_MS: '180000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Instalar dependências
        run: |
          npm ci --prefix tests
          mkdir -p tests/results

      - uses: ai-action/setup-ollama@v2

      - name: Carregar modelos do Ollama
        id: ollama
        run: |
          if ! curl -fs "$OLLAMA_BASE_URL/api/version"; then
            ollama serve > ollama.log 2>&1 &
          fi
          curl -fsS --retry 20 --retry-connrefused --retry-delay 1 --max-time 3 "$OLLAMA_BASE_URL/api/version"
          for model in $(printf '%s\n' "$APP_MODEL" "$JUDGE_MODEL" "$COMPARE_MODEL" | sort -u); do
            ollama pull "$model"
          done
          ollama list

      - name: Iniciar ShopDemo v2 com LLM
        id: app
        env:
          MODE: llm
          VERSION: v2
          LLM_MODEL: ${{ env.APP_MODEL }}
        run: |
          node app/server.js > app.log 2>&1 &
          if ! curl -fsS --retry 20 --retry-connrefused --retry-delay 1 --max-time 3 http://localhost:3000/health; then
            cat app.log
            exit 1
          fi

      - name: Verificar conectividade com o modelo
        if: ${{ !cancelled() && steps.ollama.outcome == 'success' }}
        working-directory: tests
        run: |
          npm run test:smoke -- --no-progress-bar \
            -o results/smoke.json -o results/smoke.junit.xml -o results/smoke.html
      - name: Resumo de smoke
        if: ${{ !cancelled() }}
        working-directory: tests
        run: |
          if [ -f results/smoke.json ]; then
            node ci/summary.js results/smoke.json "Verificar conectividade com o modelo"
          fi

      - name: Calibrar o juiz
        if: ${{ !cancelled() && steps.ollama.outcome == 'success' }}
        working-directory: tests
        run: |
          npm run test:judge-check -- --no-progress-bar \
            -o results/judge-check.json -o results/judge-check.junit.xml -o results/judge-check.html
      - name: Resumo de judge-check
        if: ${{ !cancelled() }}
        working-directory: tests
        run: |
          if [ -f results/judge-check.json ]; then
            node ci/summary.js results/judge-check.json "Calibrar o juiz"
          fi

      - name: Avaliar atendimento, contexto e segurança com o juiz
        if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        working-directory: tests
        run: |
          npm run test:judge -- --no-progress-bar --no-cache \
            -o results/ai.json -o results/ai.junit.xml -o results/ai.html
      - name: Resumo de ai
        if: ${{ !cancelled() }}
        working-directory: tests
        run: |
          if [ -f results/ai.json ]; then
            node ci/summary.js results/ai.json "Avaliar atendimento, contexto e segurança com o juiz"
          fi

      - name: Comparar os modelos
        if: ${{ !cancelled() && steps.ollama.outcome == 'success' }}
        working-directory: tests
        run: |
          npm run test:compare -- --no-progress-bar \
            -o results/compare.json -o results/compare.junit.xml -o results/compare.html
      - name: Resumo de compare
        if: ${{ !cancelled() }}
        working-directory: tests
        run: |
          if [ -f results/compare.json ]; then
            node ci/summary.js results/compare.json "Comparar os modelos"
          fi

      - name: Guardar relatórios
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: suite-ai
          path: tests/results/
          retention-days: 14

  publish-reports:
    name: Publicar relatórios no GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [deterministic, with-ai]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PUBLISH_REPORTS == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: suite-*
          path: reports
          merge-multiple: true

      - name: Montar índice de relatórios
        run: |
          mkdir site
          cat > site/index.html <<HTML
          <!doctype html>
          <html lang="pt-BR">
          <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Relatórios ShopDemo</title></head>
          <body>
            <h1>Relatórios de testes do ShopDemo</h1>
            <p><a href="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID">Execução $GITHUB_RUN_NUMBER</a> · Commit $GITHUB_SHA</p>
            <ul>
          HTML
          for report in \
            'deterministic|Regressão funcional (modo simulado)' \
            'classifier|Contrato do classificador' \
            'smoke|Conectividade com Ollama' \
            'judge-check|Calibração do juiz' \
            'ai|Avaliação com IA' \
            'compare|Comparação de modelos'; do
            file="${report%%|*}.html"
            cp "reports/$file" "site/$file"
            printf '    <li><a href="%s">%s</a></li>\n' "$file" "${report#*|}" >> site/index.html
          done
          printf '    </ul>\n</body>\n</html>\n' >> site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
        id: deploy
