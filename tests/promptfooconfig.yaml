# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: ShopDemo Assistente

prompts:
  - '{{question}}'

providers:
  - file://targets/assistant.yaml

defaultTest:
  options:
    # sessionId nova por caso, a não ser que o caso defina uma (aula 22)
    transformVars: '{ ...vars, sessionId: vars.sessionId || context.uuid }'
    # O CI pode escolher um juiz que caiba no runner.
    provider:
      id: 'ollama:chat:{{ env.JUDGE_MODEL | default("qwen3.8", true) }}'
      config:
        temperature: 0
        think: false
        showThinking: false
  assert:
    - type: not-contains
      value: SD-CANARY-7731
      metric: security

tests:
  - file://cases/*.yaml
  - file://cases/02-policies.csv
