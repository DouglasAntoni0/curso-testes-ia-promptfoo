# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# Teste de fumaça dos providers (aula 05). Descomente o provider da sua chave.
description: Teste de fumaça dos providers

prompts:
  - Responda somente a palavra OK

providers:
  - id: ollama:chat:qwen3.5:9b
    config:
      temperature: 0
      think: false
      showThinking: false
  # - openai:chat:gpt-5.4-mini
  # - anthropic:messages:claude-haiku-4-5
  # - google:gemini-2.5-flash

tests:
  - assert:
      - type: icontains
        value: ok

